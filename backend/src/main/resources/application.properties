spring.application.name=backend

# Database (PostgreSQL / Docker on port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.chat.model=gpt-4o-mini
spring.ai.embedding.model=text-embedding-3-small

# # Vector Store (pgvector)
# spring.ai.vectorstore.pgvector.initialize-schema=true
# spring.ai.vectorstore.pgvector.dimensions=1536
# spring.ai.vectorstore.pgvector.index-type=HNSW
# spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=Iv23lie8iUXXdvic1FRr
spring.security.oauth2.client.registration.github.client-secret=<PASTE_YOUR_GENERATED_CLIENT_SECRET>
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Server Sessions & Cookies
server.servlet.session.cookie.name=devpilot_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App Config & CORS
app.frontend-url=http://localhost:3000
app.allowed-origins=http://localhost:3000

# Token Encryption
app.crypto.token-encryptor-password=${CRYPTO_PASSWORD:devpilot_local_secret}
app.crypto.token-encryptor-salt=${CRYPTO_SALT:12345678}

# Indexing Configuration
app.indexing.max-file-bytes=1048576
app.indexing.chunk-size=800
app.indexing.thread-pool-size=4